# ==========================================
# Functional settings
# ==========================================
# Change prefix key
set -g prefix C-w
unbind C-b

# Reload config
unbind r
bind r source-file ~/.tmux.conf \; display-message "Config reloaded"

# Navigation
bind-key h select-pane -L
bind-key j select-pane -D
bind-key k select-pane -U
bind-key l select-pane -R

# Status Bar Position
set-option -g status-position top

# Indexing and Timing
set -g base-index 1
set -sg escape-time 0

# Vim-like keybinds
set-window-option -g mode-keys vi
bind v copy-mode
bind-key -T copy-mode-vi 'v' send-keys -X begin-selection

# Set shell
set-option -g default-shell /usr/bin/zsh

# ==========================================
# PLUGINS & THEME CONFIG
# ==========================================

# 1. Define Plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'catppuccin/tmux'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-yank'

# 2. Catppuccin Settings (Must be set before loading the plugin)
set -g @catppuccin_flavor "macchiato"
set -g @catppuccin_status_background "none" # Use "none" to allow our transparent override later
set -g @catppuccin_window_status_style "none"
set -g @catppuccin_pane_status_enabled "off"
set -g @catppuccin_pane_border_status "off"

# Window Text
set -g @catppuccin_window_default_text "#W"
set -g @catppuccin_window_current_text "#W"
set -g @catppuccin_window_current_number_color "#{@thm_peach}"
set -g @catppuccin_window_current_text_color "#{@thm_bg}"

# Resurrect Settings
set -g @resurrect-capture-pane-contents 'on'

# 3. Initialize Plugin Manager (This loads the theme colors!)
run '~/.tmux/plugins/tpm/tpm'

# ==========================================
# VISUAL OVERRIDES (Post-Load)
# ==========================================

set -g status-style "bg=default" 

# 2. Window Naming
set-option -g allow-rename off
set-option -g automatic-rename on
set-option -g automatic-rename-format "#{pane_current_command}"

# 3. Status Right (Folder | Time)
set -g status-right-length 100
set -g status-right ""

# Segment 1: Folder
set -ga status-right "#[fg=#{@thm_blue},bg=default] 󰉋 #{b:pane_current_path} "

# Separator
set -ga status-right "#[fg=#{@thm_overlay_0},bg=default]||"

# Segment 2: Time
set -ga status-right "#[fg=#{@thm_lavender},bg=default] 󰅐 %H:%M"

# 4. Pane Borders
setw -g pane-border-status off
setw -g pane-border-format ""
setw -g pane-active-border-style "fg=#{@thm_peach},bg=default"
setw -g pane-border-style "fg=#{@thm_overlay_2},bg=default"
setw -g pane-border-lines single
