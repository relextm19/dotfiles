# ==========================================
# Functional settings
# ==========================================
# Change prefix key
set -g prefix C-w
unbind C-b

# Reload config
unbind r
bind r source-file ~/.tmux.conf \; display-message "Config reloaded"

# Status Bar Position
set-option -g status-position top

# Indexing and Timing
set -g base-index 1
set -sg escape-time 0

# Vim-like keybinds
set-window-option -g mode-keys vi
bind v copy-mode
bind-key -T copy-mode-vi 'v' send-keys -X begin-selection
bind -n C-h select-pane -L
bind -n C-j select-pane -D
bind -n C-k select-pane -U
bind -n C-l select-pane -R

#handle the overwritten clear terminal
bind C-l send-keys 'C-l'

# Set shell
set-option -g default-shell /usr/bin/zsh

# ==========================================
# PLUGINS & THEME CONFIG
# ==========================================

# 1. Define Plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'catppuccin/tmux'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-yank'

# 2. Catppuccin Settings (Must be set before loading the plugin)
set -g @catppuccin_flavor "macchiato"
set -g @catppuccin_status_background "none" # Use "none" to allow our transparent override later

# Resurrect Settings
set -g @resurrect-capture-pane-contents 'on'

# 3. Initialize Plugin Manager (This loads the theme colors!)
run '~/.tmux/plugins/tpm/tpm'

# ==========================================
# VISUAL OVERRIDES (Post-Load)
# ==========================================
# Note: These must go AFTER 'run tpm' so the @thm_ colors are available.

# 1. Force Transparent/Black Background (Matches Rosé Pine)
# 'bg=default' usually works best to blend with nvim, but you can use 'bg=#191724' for hardcoded Rose Pine.
set -g status-style "bg=default" 

# 2. Window Naming
set-option -g allow-rename off
set-option -g automatic-rename on
set-option -g automatic-rename-format "#{pane_current_command}"

# 3. Status Right (Folder | Time)
set -g status-right-length 100
set -g status-right ""

# Segment 1: Folder
set -ga status-right "#[fg=#{@thm_blue},bg=default] 󰉋 #{b:pane_current_path} "

# Separator
set -ga status-right "#[fg=#{@thm_overlay_0},bg=default]||"

# Segment 2: Time
set -ga status-right "#[fg=#{@thm_lavender},bg=default] 󰅐 %H:%M"

# 4. Pane Borders
setw -g pane-border-status off
setw -g pane-border-format ""
setw -g pane-active-border-style "fg=#{@thm_peach},bg=default"
setw -g pane-border-style "fg=#{@thm_overlay_2},bg=default"
setw -g pane-border-lines single
